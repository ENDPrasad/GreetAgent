<!doctype html>
<html>
  <head>
    <title>Greeting Agent</title>
  </head>
  <body>
    <h1 id="greeting">loading...</h1>

    <script>
      async function loadGreeting() {
        const response = await fetch("http://127.0.0.1:8000/greet?name=Prasad");
        const data = await response.json();
        document.getElementById("greeting").innerText = data.message;
      }

      loadGreeting();
    </script>
  </body>
</html>
